<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>הפיטסרי של אוסקר</title>
<style>
  @font-face { font-family: 'Assistant'; src: url('assets/Assistant.ttf') format('truetype'); font-weight: 200 800; }
  html, body { margin: 0; height: 100%; background: #1d110a; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
  #fontwarm { position: absolute; opacity: 0; pointer-events: none; font-family: 'Assistant'; font-weight: 800; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<input id="codeInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" enterkeyhint="go" placeholder="apple-river-cake-moon">
<style>
  #codeInput { position: absolute; display: none; box-sizing: border-box; margin: 0; padding: 0 12px; border: none; outline: none;
    background: transparent; color: #2f5d50; font-family: 'Assistant', 'Segoe UI', sans-serif; font-weight: 800; text-align: center; }
  #codeInput::placeholder { color: rgba(59,35,20,.28); }
</style>
<div id="fontwarm">הפיטסרי של אוסקר 0123</div>
<audio id="music" src="assets/oscar.mp3" loop preload="auto"></audio>
<script src="src/core.js"></script>
<script src="src/data.js"></script>
<script src="src/game.js"></script>
<script src="src/game-people.js"></script>
<script src="src/art-base.js"></script>
<script src="src/icons.js"></script>
<script src="src/art-scene.js"></script>
<script src="src/art-stations.js"></script>
<script src="src/art-items.js"></script>
<script src="src/art-people.js"></script>
<script src="src/art-world.js"></script>
<script src="src/cinema.js"></script>
<script src="src/net.js"></script>
<script src="src/ui.js"></script>
<script src="src/ui-screens.js"></script>
<script src="src/ui-mp.js"></script>
<script src="src/play.js"></script>
<script src="src/app.js"></script>
<script>
  if (location.search.includes('test=1')) {
    const s = document.createElement('script');
    s.src = 'tools/test-scenes.js';
    s.onload = () => OP.App.init();
    document.body.appendChild(s);
  } else {
    OP.App.init();
  }
</script>
</body>
</html>
